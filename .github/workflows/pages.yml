name: Publish to GitHub Pages

# Builds and verifies locally and in CI; build:site runs the complete unit suite.
# One-time repository setting: Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Builds the runtimes and the allowlisted Pages artifact in site-dist/.
      # The page's version label is the commit SHA of this checkout.
      - run: npm run build:site

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site-dist/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
