name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check:agrun

      - run: npx playwright install --with-deps chromium firefox webkit

      # Pretest builds the allowlisted Pages artifact and runs unit tests;
      # Chromium, Firefox and WebKit then use that exact static artifact.
      - run: npm run test:e2e -- --workers=1
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"

      # Keep browser receipts and the revision-bound Evidence Pack generated by
      # production-verification.spec.js available for release review.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 30

      # validate:v2 checks protocol/schema conformance and attestation hash
      # integrity independently of the Playwright render assertions above —
      # a tampered or stale runtime embed can pass rendering (stale content
      # still paginates) while failing this. Runs against the exact files
      # the Pages artifact ships below.
      - run: npm run validate:v2 -- site-dist/studio-v2/samples/sales-invoice-v2.html
      - run: npm run validate:v2 -- site-dist/studio-v2/samples/purchase-order-red-v2.html
      - run: npm run validate:v2 -- site-dist/studio-v2/samples/progress-claim-northpeak-v2.html

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist/

  # Deploys only the tested allowlist artifact produced by the build job.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
