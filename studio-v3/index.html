<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Design, bind and validate ERP print forms with real A4 pagination.">
  <meta name="printform-source-revision" content="__PRINTFORM_V3_REVISION__">
  <title>Printform Studio v3</title>
  <link rel="icon" href="../studio-v2/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="../">printform<span>.js</span></a><span class="divider">/</span><h1>Studio <span class="version">v3 · Pilot</span></h1>
    <div class="header-actions">
      <button data-action="undo" data-icon="undo" title="Undo (⌘/Ctrl Z)">Undo</button>
      <button data-action="redo" data-icon="redo" title="Redo (⌘/Ctrl Shift Z)">Redo</button>
      <button data-action="new" data-icon="plus">New</button>
      <button data-action="open" data-icon="open">Open</button>
      <button data-action="save" data-icon="save">Save</button>
      <button data-action="print" data-icon="print" disabled>Print</button>
      <button data-action="export" data-icon="download" disabled>Export HTML</button>
    </div>
  </header>
  <nav class="workspace-bar" aria-label="Workspace">
    <div class="document-title"><input id="document-name" aria-label="Template name" maxlength="100"><span id="revision"></span></div>
    <div class="workspace-tabs">
      <button data-mode="design" data-icon="design" aria-current="page">Design</button>
      <button data-mode="data" data-icon="data">Data</button>
      <button data-mode="validate" data-icon="check">Validate</button>
    </div>
    <button data-action="preview" data-icon="eye" aria-pressed="false">Preview</button>
  </nav>
  <main class="studio-grid">
    <aside id="left-panel" class="side-panel" aria-label="Template structure"></aside>
    <section class="paper-workspace" aria-label="Paper preview">
      <div class="paper-toolbar"><span>A4 <span class="muted">210 × 297 mm</span></span><label>Zoom <select id="zoom"><option value="fit">Fit</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option></select></label><span id="page-count">Rendering…</span><button data-action="previous" data-icon="previous" aria-label="Previous page"></button><button data-action="next" data-icon="next" aria-label="Next page"></button></div>
      <div id="paper-scroll" tabindex="0" aria-label="Scrollable print pages"><div id="paper-wrap"><iframe id="preview-frame" title="Rendered A4 print form" sandbox="allow-scripts allow-modals" referrerpolicy="no-referrer"></iframe></div></div>
      <div id="thumbnails" aria-label="Page thumbnails"></div>
    </section>
    <aside id="right-panel" class="side-panel inspector" aria-label="Component properties"></aside>
  </main>
  <footer class="status-bar"><span id="status" role="status" aria-live="polite">Loading Studio…</span><span class="status-hint">Amounts & taxes supplied by your ERP</span><a href="../studio-v2/">Studio v2</a></footer>
  <input id="open-file" type="file" accept=".json,.html,text/html,application/json" hidden>
  <dialog id="new-dialog" aria-labelledby="new-heading"><h2 id="new-heading">Start a print form</h2><p id="new-warning"></p><div class="template-options"><button data-template="blank">Blank form<span>Build your structure step by step</span></button><button data-template="invoice">Invoice<span>Customer, line items, supplied totals</span></button><button data-template="purchase">Purchase order<span>Supplier, delivery and approval</span></button><button data-template="delivery">Delivery note<span>Quantities, packages and receipt</span></button></div><button data-action="cancel-new">Cancel</button></dialog>
  <noscript>Studio requires JavaScript to design and paginate forms.</noscript>
</body>
</html>
