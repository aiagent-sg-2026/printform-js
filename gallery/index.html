<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self'; script-src 'self'; base-uri 'self'; object-src 'none'">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191f2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PrintForm Gallery">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>PrintForm Gallery</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="./gallery.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html" aria-label="PrintForm home">PrintForm <span>Gallery</span></a>
    <div class="language" aria-label="Language">
      <button type="button" data-language="en" aria-pressed="true">EN</button>
      <button type="button" data-language="zh" aria-pressed="false">中文</button>
    </div>
  </header>
  <main>
    <section class="intro">
      <p class="eyebrow" data-i18n="eyebrow">DOCUMENT DESIGN LIBRARY</p>
      <h1 data-i18n="heading">Forms made for print.</h1>
      <p data-i18n="subheading">Explore live, paginated business documents built with PrintForm.js.</p>
    </section>
    <section class="controls" aria-label="Gallery filters">
      <label class="search"><span data-i18n="searchLabel">Search designs</span><input id="search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search by name or tag"></label>
      <div class="filter-group"><span data-i18n="typeLabel">Document type</span><div id="type-filters" class="chips" role="group" aria-label="Document type"></div></div>
      <div class="filter-group"><span data-i18n="paperLabel">Paper</span><div id="paper-filters" class="chips" role="group" aria-label="Paper size"></div></div>
    </section>
    <p id="result-count" class="result-count" aria-live="polite"></p>
    <section id="gallery-grid" class="gallery-grid" aria-label="Print form designs"></section>
    <p id="empty-state" class="empty-state" hidden data-i18n="empty">No designs match these filters.</p>
  </main>
  <div id="connection-status" class="status-chip" role="status" hidden></div>
  <div id="update-banner" class="update-banner" role="status" hidden><span></span><button id="update-button" type="button"></button></div>
  <div id="update-overlay" class="update-overlay" role="status" aria-live="polite" hidden><span class="loader"></span><span data-i18n="updating">Updating PrintForm Gallery...</span></div>
  <button id="scroll-top" class="scroll-top" type="button" aria-label="Scroll to top" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <dialog id="design-modal" aria-labelledby="modal-title">
    <div class="modal-header"><div><h2 id="modal-title"></h2><p id="modal-meta"></p></div><button type="button" class="icon-button" data-close aria-label="Close viewer">×</button></div>
    <div class="frame-wrap"><iframe title="Live print form preview"></iframe></div>
    <footer class="modal-actions">
      <a class="button secondary" data-open target="_blank" rel="noopener"></a>
      <button type="button" class="button secondary" data-print disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M7 14h10v7H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="printDesign">Print</span>
      </button>
      <a class="button primary" data-studio target="_blank" rel="noopener" hidden></a>
    </footer>
  </dialog>
</body>
</html>
