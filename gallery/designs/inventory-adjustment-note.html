<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock Adjustment Note</title>
    <link rel="stylesheet" href="shared/page.css" />
    <script src="shared/print-size.js"></script>
    <link rel="stylesheet" href="shared/tight-tables.css" />
    <style>
      body {
        color: #392f39;
        font-family: Arial, "Helvetica Neue", sans-serif;
      }
      .paper_width {
        width: 750px;
      }
      .section-table {
        table-layout: fixed;
      }
      .section-table td {
        box-sizing: border-box;
        vertical-align: top;
      }
      .inner,
      .items {
        width: 100%;
        table-layout: fixed;
      }
      .box {
        padding: 8px;
        background: #f7f0f6;
        border: 1px solid #e4d4e1;
        font-size: 13px;
        line-height: 19px;
      }
      .items td {
        font-size: 13px;
        line-height: 19px;
      }
      .head {
        background: #9c5a8a;
        color: white;
        font-weight: 700;
      }
      .head {
        box-sizing: border-box;
        border-bottom: 1px solid #e8dce5;
      }
      .cell {
        box-sizing: border-box;
      }
      .cell {
        border-bottom: 1px solid #e8dce5;
      }
      .cell-content {
        overflow: hidden;
        padding: 5px 4px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .change {
        color: #7a3f6c;
        font-weight: 700;
      }
      .page-number {
        padding: 6px;
        text-align: center;
        font-size: 13px;
      }
    </style>
  </head>
  <body data-pf-label="PF-026 · Stock Adjustment Note · Mauve">
    <div
      class="paper_width printform"
      data-papersize-width="750"
      data-papersize-height="1050"
      data-repeat-header="y"
      data-repeat-rowheader="y"
      data-repeat-footer-pagenum="y"
    >
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pheader">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <svg
              width="720"
              height="88"
              viewBox="0 0 720 88"
              xmlns="http://www.w3.org/2000/svg"
              role="img"
              aria-label="Juniper Inventory Control"
            >
              <rect width="720" height="88" fill="#9C5A8A" />
              <path
                d="M44 20v48M28 33c8 0 16 6 16 15M60 33c-8 0-16 6-16 15M30 52c8 0 14 5 14 12M58 52c-8 0-14 5-14 12"
                fill="none"
                stroke="white"
                stroke-width="3"
              />
              <text x="86" y="42" fill="white" font-family="Arial,sans-serif" font-size="21" font-weight="700">
                JUNIPER INVENTORY CONTROL
              </text>
              <text x="86" y="65" fill="#f8eaf4" font-family="Arial,sans-serif" font-size="13">STOCK ADJUSTMENT · ADJ-261026-14</text>
              <text x="690" y="52" fill="white" font-family="Arial,sans-serif" font-size="15" text-anchor="end">POSTED 26 OCT 2026</text>
            </svg>
          </td>
          <td></td>
        </tr>
      </table>
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pdocinfo">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <table class="inner">
              <tr>
                <td style="width: 50%"></td>
                <td style="width: 50%"></td>
              </tr>
              <tr>
                <td>
                  <div class="box"><b>WAREHOUSE</b><br />Central Store · Zone C<br />Requester: Dana Example</div>
                </td>
                <td>
                  <div class="box"><b>SUPPORTING EVIDENCE</b><br />Cycle count variance CC-441<br />Attachment: recount sheet 26-10-C</div>
                </td>
              </tr>
            </table>
          </td>
          <td></td>
        </tr>
      </table>
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table prowheader">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <table class="items">
              <tr id="adjustment-header"></tr>
            </table>
          </td>
          <td></td>
        </tr>
      </table>
      <div id="adjustment-rows"></div>
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <div class="box">
              Inventory value impact: <b id="impact"></b> &nbsp; Basis: sample cost $12.50/unit.<br />Authorized by ____________________
              <img src="assets/stamp-approved.svg" width="110" height="55" alt="Approved sample stamp"
                style="float: right; margin: -8px 8px 0 12px;" />
              <div><img src="assets/signature-sample.svg" width="120" height="60" alt="Sample authorization signature" /></div>
              &nbsp; Posted by ____________________
            </div>
          </td>
          <td></td>
        </tr>
      </table>
      <script>
        const widths = [75, "inherit", 65, 95, 95, 95, 115];
        const alignments = ["left", "left", "left", "right", "right", "right", "left"];
        const headers = ["SKU", "Description", "Bin", "Before Qty", "Adjustment", "After Qty", "Reason"];
        const widthRow = () =>
          `<tr>${widths.map((width) => `<td style="width:${width === "inherit" ? width : `${width}px`}"></td>`).join("")}</tr>`;
        const header = document.getElementById("adjustment-header");
        header.outerHTML = `${widthRow()}<tr>${headers.map((label, cell) => `<td class="head" align="${alignments[cell]}"><div class="cell-content">${label}</div></td>`).join("")}</tr>`;
        const itemNames = [
          "Hex Bolt M8",
          "LED Panel 24W",
          "Steel Bracket",
          "Copper Wire 2mm",
          "Safety Gloves",
          "Water Valve 1in",
          "Cable Tray 1m",
          "Door Hinge",
          "Work Light 12V",
          "Pipe Clamp 20mm",
          "Fuse 10A",
          "Anchor Bolt M10",
        ];
        const adjustmentRows = Array.from({ length: 73 }, (_, index) => {
          const before = 20 + ((index * 7) % 83);
          const adjustment = index % 2 ? 2 : -1;
          return [
            `AD-${String(index + 41).padStart(3, "0")}`,
            itemNames[index % itemNames.length],
            `C-${String((index % 24) + 1).padStart(2, "0")}`,
            before,
            adjustment,
            before + adjustment,
            index % 2 ? "Recount surplus" : "Count shortage",
          ];
        });
        const target = document.getElementById("adjustment-rows");
        let quantityChange = 0;
        adjustmentRows.forEach((row) => {
          quantityChange += row[4];
          const table = document.createElement("table");
          table.className = "paper_width section-table prowitem";
          table.innerHTML = `<tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr><tr><td></td><td><table class="items">${widthRow()}<tr>${row.map((value, cell) => `<td class="cell${cell === 4 ? " change" : ""}" align="${alignments[cell]}"><div class="cell-content">${value}</div></td>`).join("")}</tr></table></td><td></td></tr>`;
          target.before(table);
        });
        target.remove();
        const impact = quantityChange * 12.5;
        const formattedImpact = `$${Math.abs(impact).toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        })}`;
        document.getElementById("impact").textContent = `${impact < 0 ? "−" : ""}${formattedImpact}`;
      </script>
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter_pagenum">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <div class="page-number" data-page-number-container>Page <span data-page-number></span> of <span data-page-total></span></div>
          </td>
          <td></td>
        </tr>
      </table>
    </div>
    <script src="../../dist/printform.js"></script>
  </body>
</html>
