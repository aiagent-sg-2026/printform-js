<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commission Statement</title>
    <link rel="stylesheet" href="shared/page.css" />
    <script src="shared/print-size.js"></script>
    <link rel="stylesheet" href="shared/tight-tables.css" />
    <style>
      body {
        color: #393b24;
        font-family: Arial, "Helvetica Neue", sans-serif;
      }
      .paper_width {
        width: 750px;
      }
      .section-table {
        table-layout: fixed;
      }
      .section-table td {
        box-sizing: border-box;
        vertical-align: top;
      }
      .inner,
      .items {
        width: 100%;
        table-layout: fixed;
      }
      .tiles td {
        width: 33%;
        padding: 8px;
        background: #f1f0df;
        font-size: 13px;
      }
      .items td {
        font-size: 13px;
        line-height: 19px;
      }
      .head {
        border-bottom: 2px solid #827717;
        color: #5e5814;
        font-weight: 700;
      }
      .head {
        box-sizing: border-box;
        border-bottom: 1px solid #dcdcc9;
      }
      .cell {
        box-sizing: border-box;
      }
      .cell {
        border-bottom: 1px solid #dcdcc9;
      }
      .cell-content {
        overflow: hidden;
        padding: 3px 4px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .payout {
        padding: 10px;
        background: #827717;
        color: white;
        font-size: 15px;
      }
      .page-number {
        padding: 6px;
        text-align: center;
        font-size: 13px;
      }
    </style>
  </head>
  <body data-pf-label="PF-022 · Commission Statement · Olive gold">
    <div
      class="paper_width printform"
      data-papersize-width="750"
      data-papersize-height="971"
      data-repeat-header="y"
      data-repeat-rowheader="y"
      data-repeat-footer-pagenum="y"
    >
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pheader">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <svg width="720" height="92" viewBox="0 0 720 92" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gold Crest Commission Statement">
              <rect width="720" height="92" fill="#f7f6eb" />
              <rect width="13" height="92" fill="#827717" />
              <rect x="24" y="12" width="204" height="68" rx="8" fill="#fff" />
              <image x="30" y="22" width="180" height="48" href="assets/logo-gold-crest.svg" />
              <text x="690" y="47" fill="#827717" font-family="Arial,sans-serif" font-size="18" text-anchor="end" font-weight="700">CS-2026-10-18</text>
              <text x="690" y="67" fill="#666744" font-family="Arial,sans-serif" font-size="13" text-anchor="end">COMMISSION STATEMENT · OCT 2026</text>
            </svg>
          </td>
          <td></td>
        </tr>
      </table>
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pdocinfo">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <table class="inner">
              <tr>
                <td style="width: 100%"></td>
              </tr>
              <tr>
                <td><b>SALESPERSON · Jordan Example</b> &nbsp; Period · 01–31 Oct 2026</td>
              </tr>
            </table>
            <table class="inner tiles">
              <tr>
                <td><b>PLAN</b><br />Standard · 5%</td>
                <td><b>CURRENCY</b><br />USD</td>
                <td><b>PAYMENT DATE</b><br />15 Nov 2026</td>
              </tr>
            </table>
          </td>
          <td></td>
        </tr>
      </table>
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table prowheader">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <table class="items">
              <tr>
                <td class="head"><div class="cell-content">Date</div></td>
                <td class="head"><div class="cell-content">Invoice</div></td>
                <td class="head"><div class="cell-content">Customer</div></td>
                <td class="head" align="right"><div class="cell-content">Eligible Sales</div></td>
                <td class="head" align="right"><div class="cell-content">Rate</div></td>
                <td class="head" align="right"><div class="cell-content">Adj.</div></td>
                <td class="head" align="right"><div class="cell-content">Commission</div></td>
              </tr>
            </table>
          </td>
          <td></td>
        </tr>
      </table>
      <div id="commission-rows"></div>
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <div class="payout">
              Earned <span id="earned"></span> &nbsp; Adjustments <span id="adjustments"></span> &nbsp; NET PAYOUT <b id="net-payout"></b>
            </div>
            <div style="padding: 8px; font-size: 13px">Approved by ______________________ &nbsp; Finance review ______________________</div>
          </td>
          <td></td>
        </tr>
      </table>
      <script>
        const widths = [80, 95, 130, "inherit", 55, 105, 140];
        const widthRow = () =>
          `<tr>${widths.map((width) => `<td style="width:${width === "inherit" ? "inherit" : `${width}px`}"></td>`).join("")}</tr>`;
        document.querySelector(".prowheader .items").insertAdjacentHTML("afterbegin", widthRow());
        const commissionRows = Array.from({ length: 128 }, (_, index) => {
          const sales = 420 + index * 17;
          const adjustment = index % 6 === 0 ? -8 : 0;
          const month = "Oct";
          return [
            `${String((index % 28) + 1).padStart(2, "0")} ${month}`,
            `SI-${10510 + index}`,
            `Client ${String((index % 24) + 1).padStart(2, "0")}`,
            sales,
            "5%",
            adjustment,
            sales * 0.05 + adjustment,
          ];
        });
        const money = (value) => {
          const sign = value < 0 ? "−" : "";
          const formatted = Math.abs(value).toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          });
          return `${sign}$${formatted}`;
        };
        const target = document.getElementById("commission-rows");
        let earned = 0;
        let adjustments = 0;
        for (const row of commissionRows) {
          earned += row[3] * 0.05;
          adjustments += row[5];
          const table = document.createElement("table");
          table.className = "paper_width section-table prowitem";
          table.innerHTML = `<tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr><tr><td></td><td><table class="items">${widthRow()}<tr>${row
            .map((value, index) => {
              const display = index === 3 || index === 5 || index === 6 ? money(Number(value)) : value;
              const alignment = index > 2 ? ' align="right"' : "";
              return `<td class="cell"${alignment}><div class="cell-content">${display}</div></td>`;
            })
            .join("")}</tr></table></td><td></td></tr>`;
          target.before(table);
        }
        target.remove();
        document.getElementById("earned").textContent = money(earned);
        document.getElementById("adjustments").textContent = money(adjustments);
        document.getElementById("net-payout").textContent = money(earned + adjustments);
      </script>
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter_pagenum">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <div class="page-number" data-page-number-container>Page <span data-page-number></span> of <span data-page-total></span></div>
          </td>
          <td></td>
        </tr>
      </table>
    </div>
    <script src="../../dist/printform.js"></script>
  </body>
</html>
