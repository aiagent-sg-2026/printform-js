<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bin Location Label Sheet</title>
    <link rel="stylesheet" href="shared/page.css" />
    <style>
      body {
        color: #263a3c;
        font-family: Arial, "Helvetica Neue", sans-serif;
      }
      .paper_width {
        width: 750px;
      }
      .section-table {
        table-layout: fixed;
      }
      .section-table td {
        box-sizing: border-box;
        vertical-align: top;
      }
      .inner,
      .items {
        width: 100%;
        table-layout: fixed;
      }
      .batch {
        padding: 6px 9px;
        color: white;
        background: #4a7c82;
        font-size: 13px;
      }
      .items td {
        font-size: 13px;
      }
      .label {
        height: 135px;
        padding: 8px;
        border: 1px dashed #6c898b;
        background: #fbfdfd;
      }
      .aisle {
        color: #4a7c82;
        font-weight: 700;
      }
      .code {
        margin: 4px 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .barcode {
        font-family: "Courier New", monospace;
        font-size: 17px;
        letter-spacing: 2px;
      }
      .page-number {
        padding: 6px;
        text-align: center;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div
      class="paper_width printform"
      data-papersize-width="750"
      data-papersize-height="1050"
      data-repeat-header="y"
      data-repeat-rowheader="y"
      data-repeat-footer-pagenum="y"
    >
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pheader">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <svg
              width="720"
              height="72"
              viewBox="0 0 720 72"
              xmlns="http://www.w3.org/2000/svg"
              role="img"
              aria-label="Tideway Warehouse Labels"
            >
              <rect width="720" height="72" fill="#4A7C82" />
              <path d="M26 39c12-16 24 16 36 0s24 16 36 0" fill="none" stroke="white" stroke-width="3" />
              <text x="120" y="34" fill="white" font-family="Arial,sans-serif" font-size="20" font-weight="700">
                TIDEWAY WAREHOUSE · BIN LABELS
              </text>
              <text x="120" y="56" fill="#e1f0f0" font-family="Arial,sans-serif" font-size="13">PRINT BATCH WB-261026-03 · 18 LABELS</text>
            </svg>
          </td>
          <td></td>
        </tr>
      </table>
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pdocinfo">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <div class="batch">CUT ON DASHED LINES &nbsp; · &nbsp; Label stock: 90 × 48 mm &nbsp; · &nbsp; Warehouse: North Dock</div>
          </td>
          <td></td>
        </tr>
      </table>
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table prowheader">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <table class="items">
              <tr>
                <td style="width: 50%"></td>
                <td style="width: 50%"></td>
              </tr>
              <tr>
                <td style="padding: 3px"></td>
                <td style="padding: 3px"></td>
              </tr>
            </table>
          </td>
          <td></td>
        </tr>
      </table>
      <div id="label-rows"></div>
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <div style="padding: 7px; border-top: 1px solid #4a7c82; font-size: 13px">
              Label dimensions: 90 × 48 mm &nbsp; · &nbsp; Print at 100% scale; trim on cut lines.
            </div>
          </td>
          <td></td>
        </tr>
      </table>
      <script>
        const labelRecords = Array.from({ length: 18 }, (_, index) => ({
          warehouse: "NORTH DOCK",
          aisle: String.fromCharCode(65 + Math.floor(index / 6)),
          rack: `R${String((index % 6) + 1).padStart(2, "0")}`,
          bin: `${String.fromCharCode(65 + Math.floor(index / 6))}-R${String((index % 6) + 1).padStart(2, "0")}-B${String(index + 1).padStart(2, "0")}`,
          barcode: `*${String(810000 + index)}*`,
        }));
        const target = document.getElementById("label-rows");
        for (let index = 0; index < labelRecords.length; index += 2) {
          const cells = labelRecords
            .slice(index, index + 2)
            .map(
              (record) =>
                `<td class="label"><div>${record.warehouse}</div><div class="aisle">AISLE ${record.aisle} · RACK ${record.rack}</div><div class="code">${record.bin}</div><div class="barcode">${record.barcode}</div></td>`,
            )
            .join("");
          const table = document.createElement("table");
          table.className = "paper_width section-table prowitem";
          table.innerHTML = `<tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr><tr><td></td><td><table class="items"><tr><td style="width:50%"></td><td style="width:50%"></td></tr><tr>${cells}</tr></table></td><td></td></tr>`;
          target.before(table);
        }
        target.remove();
      </script>
      <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter_pagenum">
        <tr>
          <td style="width: 15px"></td>
          <td style="width: inherit"></td>
          <td style="width: 15px"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <div class="page-number" data-page-number-container>Page <span data-page-number></span> of <span data-page-total></span></div>
          </td>
          <td></td>
        </tr>
      </table>
    </div>
    <script src="../../dist/printform.js"></script>
  </body>
</html>
