<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orange Work Order</title>
  <link rel="stylesheet" href="shared/page.css">
  <style>
    body { color: #3b2c25; font-family: Arial, "Helvetica Neue", sans-serif; }
    .paper_width { width: 750px; }
    .section-table { table-layout: fixed; }
    .section-table td { box-sizing: border-box; vertical-align: top; }
    .header-art { display: block; width: 100%; height: 76px; }
    .info-grid, .items-grid { width: 100%; table-layout: fixed; }
    .info-grid td { width: 50%; padding: 0 6px; font-size: 13px; line-height: 17px; }
    .info-box { padding: 5px 7px; border: 1px solid #f0c9b8; }
    .info-label { color: #c2410c; font-weight: 700; }
    .items-grid td { font-size: 13px; line-height: 17px; }
    .head-cell { background: #c2410c; color: white; font-weight: 700; }
    .item-cell { border-bottom: 1px solid #eadbd4; }
    .alternate { background: #fff6f1; }
    .cell-content { padding: 3px 5px; }
    .signoff { margin-top: 8px; padding: 8px 4px 4px; border-top: 1px solid #8b766b; font-size: 13px; }
    .page-number { padding: 5px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="paper_width printform" data-papersize-width="750" data-papersize-height="600"
    data-repeat-header="y" data-repeat-rowheader="y" data-repeat-footer-pagenum="y">
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pheader">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr><td></td><td><svg class="header-art" viewBox="0 0 720 76" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cinder Service">
        <rect width="720" height="76" fill="#c2410c"/>
        <path d="M27 20h42v37H27zM36 29h24M36 39h24M36 49h16" fill="none" stroke="white" stroke-width="3"/>
        <text x="82" y="35" fill="white" font-family="Arial,sans-serif" font-size="21" font-weight="700">CINDER SERVICE CO.</text>
        <text x="82" y="57" fill="#ffedd5" font-family="Arial,sans-serif" font-size="13">FIELD OPERATIONS</text>
        <text x="690" y="49" fill="white" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="end">WORK ORDER</text>
      </svg></td><td></td></tr>
    </table>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pdocinfo">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr><td></td><td><table class="info-grid"><tr><td style="width:50%"></td><td style="width:50%"></td></tr><tr>
        <td><div class="info-box"><div class="info-label">TECHNICIAN</div>Riley Example · Tech T-017<br>Order: CS-26108</div></td>
        <td><div class="info-box"><div class="info-label">SERVICE SITE</div>Sample Workshop, Unit 4<br>22 Imaginary Street, Salem, OR</div></td>
      </tr></table></td><td></td></tr>
    </table>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table prowheader">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr><td></td><td><table class="items-grid">
        <tr><td style="width:inherit"></td><td style="width:140px"></td><td style="width:85px"></td><td style="width:110px"></td></tr>
        <tr><td class="head-cell">Task</td><td class="head-cell" align="right">Parts</td><td class="head-cell" align="right">Hours</td><td class="head-cell">Status</td></tr>
      </table></td><td></td></tr>
    </table>
    <div id="work-items"></div>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr><td></td><td><div class="signoff">Customer sign-off: __________________________________ &nbsp; Date: ______________</div></td><td></td></tr>
    </table>
    <script>
      const tasks = ["Inspect control panel", "Replace intake filter", "Test safety switch", "Tighten drive belt", "Clean vent housing", "Check pressure gauge", "Lubricate bearings", "Verify power connection", "Record final readings"];
      const parts = ["Filter kit", "Fuse set", "Seal pack", "None", "Belt set", "Connector"];
      const target = document.getElementById("work-items");
      for (let index = 0; index < 9; index += 1) {
        const cells = [tasks[index], parts[index % parts.length], (index % 3 + 1).toFixed(1), index < 8 ? "Complete" : "Checked"];
        const table = document.createElement("table");
        table.cellPadding = "0";
        table.cellSpacing = "0";
        table.border = "0";
        table.className = "paper_width section-table prowitem";
        table.innerHTML = `
          <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
          <tr>
            <td></td>
            <td>
              <table class="items-grid">
                <tr><td style="width:inherit"></td><td style="width:140px"></td><td style="width:85px"></td><td style="width:110px"></td></tr>
                <tr>${cells.map((value, cell) => `
                  <td class="item-cell${index % 2 ? " alternate" : ""}"${cell === 1 || cell === 2 ? ' align="right"' : ""}>
                    <div class="cell-content">${value}</div>
                  </td>`).join("")}
                </tr>
              </table>
            </td>
            <td></td>
          </tr>`;
        target.before(table);
      }
      target.remove();
    </script>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter_pagenum">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr><td></td><td><div class="page-number" data-page-number-container>Page <span data-page-number></span> of <span data-page-total></span></div></td><td></td></tr>
    </table>
  </div>
  <script src="../../dist/printform.js"></script>
</body>
</html>
