<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fieldway Delivery Note</title>
  <link rel="stylesheet" href="shared/page.css">
  <script src="shared/print-size.js"></script>
  <style>
    body { color: #263432; font-family: Arial, "Helvetica Neue", sans-serif; }
    .paper_width { width: 750px; }
    .section-table { table-layout: fixed; }
    .section-table td { box-sizing: border-box; vertical-align: top; }
    .header-art { display: block; width: 100%; height: 88px; }
    .info-box { padding: 8px; border: 1px solid #d1dfdc; font-size: 13px; line-height: 19px; }
    .items-grid { width: 100%; table-layout: fixed; }
    .items-grid td { box-sizing: border-box; font-size: 13px; line-height: 18px; }
    .head-cell { background: #0f766e; color: #fff; font-weight: 700; }
    .item-cell { border-bottom: 1px solid #d4dfdd; }
    .alternate { background: #eff4f3; }
    .cell-content { padding: 4px; }
    .items-grid .head-cell .cell-content { padding: 4px; }
    .product-cell .cell-content { display: inline-flex; align-items: center; gap: 6px; height: 18px; white-space: nowrap; }
    .product-cell img { width: 24px; height: 24px; flex: none; }
    .signature img { display: block; width: 120px; height: 45px; margin-bottom: 2px; }
    .signature .footer-logo { display: inline-block; width: 90px; height: 24px; margin-left: 8px; }
    .footer-logo { display: inline-block; vertical-align: middle; width: 90px; height: 24px; margin-left: 8px; color: #0f766e; }
    .signatures { width: 100%; table-layout: fixed; margin-top: 10px; }
    .signatures td { width: 33.3%; padding: 8px; border-top: 1px solid #8a9d99; font-size: 13px; }
    .page-number { padding: 8px 0; font-size: 13px; text-align: center; }
  </style>
</head>
<body data-pf-label="PF-003 · Fieldway Delivery Note · Teal">
  <div class="paper_width printform"
    data-papersize-width="750" data-papersize-height="600"
    data-repeat-header="y" data-repeat-rowheader="y" data-repeat-footer-pagenum="y">
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pheader">
      <tr>
        <td style="width:15px"></td>
        <td style="width:inherit"></td>
        <td style="width:15px"></td>
      </tr>
      <tr>
        <td></td>
        <td>
          <svg class="header-art" viewBox="0 0 720 88" xmlns="http://www.w3.org/2000/svg"
            role="img" aria-label="Eucalyptus sample company delivery note">
            <rect width="720" height="88" fill="#0f766e"/>
            <rect x="18" y="17" width="184" height="54" rx="8" fill="#fff"/>
            <image x="27" y="22" width="165" height="44" href="assets/logo-eucalyptus.svg" aria-label="Eucalyptus sample logo"/>
            <text x="220" y="64" fill="#d5eeea" font-family="Arial,sans-serif" font-size="13">DELIVERY NOTE</text>
            <text x="690" y="53" fill="#fff" font-family="Arial,sans-serif" font-size="16" text-anchor="end">DN-2084 · OCT 26, 2026</text>
          </svg>
        </td>
        <td></td>
      </tr>
    </table>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pdocinfo">
      <tr>
        <td style="width:15px"></td>
        <td style="width:inherit"></td>
        <td style="width:15px"></td>
      </tr>
      <tr>
        <td></td>
        <td>
          <div class="info-box"><b>CONSIGNEE</b><br>Juniper Market · Receiving, Casey Morgan<br>88 Harbor Road, Astoria, OR 97103 · Route FW-12</div>
        </td>
        <td></td>
      </tr>
    </table>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table prowheader">
      <tr>
        <td style="width:15px"></td>
        <td style="width:inherit"></td>
        <td style="width:15px"></td>
      </tr>
      <tr>
        <td></td>
        <td>
          <table class="items-grid">
            <tr>
              <td style="width:70px"></td>
              <td style="width:inherit"></td>
              <td style="width:75px"></td>
              <td style="width:80px"></td>
              <td style="width:115px"></td>
            </tr>
            <tr>
              <td class="head-cell"><div class="cell-content">Item</div></td>
              <td class="head-cell"><div class="cell-content">Description</div></td>
              <td class="head-cell" align="right"><div class="cell-content">Ordered</div></td>
              <td class="head-cell" align="right"><div class="cell-content">Delivered</div></td>
              <td class="head-cell"><div class="cell-content">Remarks</div></td>
            </tr>
          </table>
        </td>
        <td></td>
      </tr>
    </table>
    <div id="delivery-items"></div>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter">
      <tr>
        <td style="width:15px"></td>
        <td style="width:inherit"></td>
        <td style="width:15px"></td>
      </tr>
      <tr>
        <td></td>
        <td>
          <table class="signatures" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td>Received by: ______________</td>
              <td>
                <img src="assets/signature-sample.svg" alt="Fictional sample signature">
                Signature: ______________
              </td>
              <td>Date: __________
                <img class="footer-logo" src="assets/footer-logo-2.svg" alt="Eucalyptus sample footer logo">
              </td>
            </tr>
          </table>
        </td>
        <td></td>
      </tr>
    </table>
    <script>
      const goods = [
        "Citrus boxes", "Glass bottles", "Market bags", "Herb crates",
        "Oat milk cases", "Paper napkins", "Olive oil tins", "Tea cartons",
        "Coffee bags", "Produce crates", "Cereal boxes", "Spice jars"
      ];
      const productIcons = [
        "canvas-tote", "stoneware-cup", "linen-pouch", "desk-journal",
        "steel-bottle", "wool-coaster", "glass-jar", "bamboo-pen",
        "cork-mat", "storage-tin", "cotton-towel", "desk-tray",
        "pencil-set", "tea-canister", "gift-box", "parcel-box"
      ];
      const target = document.getElementById("delivery-items");

      for (let index = 0; index < 14; index += 1) {
        const delivered = index % 5 + 2;
        const cells = [
          `FW-${420 + index}`,
          goods[index % goods.length],
          delivered + (index % 4 === 0 ? 1 : 0),
          delivered,
          index % 4 === 0 ? "1 short" : "Checked"
        ];
        const table = document.createElement("table");
        table.cellPadding = "0";
        table.cellSpacing = "0";
        table.border = "0";
        table.className = "paper_width section-table prowitem";
        table.innerHTML = `
          <tr>
            <td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td>
          </tr>
          <tr>
            <td></td>
            <td>
              <table class="items-grid">
                <tr>
                  <td style="width:70px"></td><td style="width:inherit"></td><td style="width:75px"></td>
                  <td style="width:80px"></td><td style="width:115px"></td>
                </tr>
                <tr>${cells.map((value, cell) => {
                  const icon = cell === 1
                    ? `<img src="assets/product-${productIcons[index % productIcons.length]}.svg" alt="${productIcons[index % productIcons.length]}">`
                    : "";
                  const productCell = cell === 1 ? " product-cell" : "";
                  const alignment = cell === 2 || cell === 3 ? ' align="right"' : "";
                  return `
                    <td class="item-cell${index % 2 ? " alternate" : ""}${productCell}"${alignment}>
                      <div class="cell-content">${icon}${value}</div>
                    </td>`;
                }).join("")}</tr>
              </table>
            </td>
            <td></td>
          </tr>`;
        target.before(table);
      }
      target.remove();
    </script>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter_pagenum">
      <tr>
        <td style="width:15px"></td>
        <td style="width:inherit"></td>
        <td style="width:15px"></td>
      </tr>
      <tr>
        <td></td>
        <td><div class="page-number" data-page-number-container>Page <span data-page-number></span> of <span data-page-total></span></div></td>
        <td></td>
      </tr>
    </table>
  </div>
  <script src="../../dist/printform.js"></script>
</body>
</html>
