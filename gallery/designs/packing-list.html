<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cedar Packing List</title>
  <link rel="stylesheet" href="shared/page.css">
  <style>
    body { color: #302d29; font-family: Arial, "Helvetica Neue", sans-serif; }
    .paper_width { width: 750px; }
    .section-table { table-layout: fixed; }
    .section-table td { box-sizing: border-box; vertical-align: top; }
    .header-art { display: block; width: 100%; height: 94px; }
    .info-grid, .items-grid, .totals-grid { width: 100%; table-layout: fixed; }
    .info-grid td { width: 50%; padding: 0 5px; font-size: 13px; line-height: 18px; }
    .info-box { padding: 7px; border: 1px solid #ded8cf; }
    .items-grid td { box-sizing: border-box; font-size: 13px; line-height: 18px; }
    .head-cell { background: #b45309; color: #fff; font-weight: 700; }
    .item-cell { border-bottom: 1px solid #ded8cf; }
    .alternate { background: #f4f1ec; }
    .cell-content { padding: 4px; }
    .items-grid .head-cell .cell-content { padding: 4px; }
    .product-cell .cell-content { display: inline-flex; align-items: center; gap: 6px; height: 18px; white-space: nowrap; }
    .product-cell img { width: 24px; height: 24px; flex: none; }
    .footer-logo { display: inline-block; vertical-align: middle; width: 90px; height: 24px; margin-left: 8px; color: #b45309; }
    .totals-grid td { padding: 7px; border-top: 1px solid #222; font-size: 13px; font-weight: 700; }
    .page-number { padding: 8px 0; font-size: 13px; text-align: center; }
  </style>
</head>
<body data-pf-label="PF-005 · Cedar Packing List · Orange">
  <div class="paper_width printform"
    data-papersize-width="750" data-papersize-height="971"
    data-repeat-header="y" data-repeat-rowheader="y" data-repeat-footer-pagenum="y">
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pheader">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr>
        <td></td>
        <td>
          <svg class="header-art" viewBox="0 0 720 94" xmlns="http://www.w3.org/2000/svg"
            role="img" aria-label="Harbor sample company packing list">
            <rect width="720" height="94" fill="#222"/>
            <rect x="18" y="20" width="184" height="54" rx="8" fill="#fff"/>
            <image x="27" y="25" width="165" height="44" href="assets/logo-harbor.svg" aria-label="Harbor sample logo"/>
            <text x="220" y="65" fill="#e6d5c3" font-family="Arial,sans-serif" font-size="13">DISTRIBUTION · SHIPMENT RECORD</text>
            <text x="690" y="55" fill="#fff" font-family="Arial,sans-serif" font-size="20" text-anchor="end">PACKING LIST</text>
          </svg>
        </td>
        <td></td>
      </tr>
    </table>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pdocinfo">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr>
        <td></td>
        <td>
          <table class="info-grid">
            <tr><td style="width:50%"></td><td style="width:50%"></td></tr>
            <tr>
              <td><div class="info-box"><b>SHIP TO</b><br>Bluebird Home · Receiving<br>44 King Street, Seattle, WA 98104<br>PL-77031 · October 26, 2026</div></td>
              <td><div class="info-box"><b>SHIPMENT DETAILS</b><br><span id="packing-shipment-details"></span><br>Dimensions: 60 × 40 × 35 cm / carton<br>Westline Freight · WF-804226</div></td>
            </tr>
          </table>
        </td>
        <td></td>
      </tr>
    </table>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table prowheader">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr>
        <td></td>
        <td>
          <table class="items-grid">
            <tr>
              <td style="width:65px"></td><td style="width:inherit"></td><td style="width:54px"></td>
              <td style="width:70px"></td><td style="width:75px"></td><td style="width:70px"></td>
            </tr>
            <tr>
              <td class="head-cell"><div class="cell-content">Carton</div></td>
              <td class="head-cell"><div class="cell-content">Item</div></td>
              <td class="head-cell" align="right"><div class="cell-content">Qty</div></td>
              <td class="head-cell" align="right"><div class="cell-content">Net kg</div></td>
              <td class="head-cell" align="right"><div class="cell-content">Gross kg</div></td>
              <td class="head-cell" align="right"><div class="cell-content">CBM</div></td>
            </tr>
          </table>
        </td>
        <td></td>
      </tr>
    </table>
    <div id="packing-items"></div>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr>
        <td></td>
        <td>
          <table class="totals-grid">
            <tr>
              <td id="packing-totals">Shipment totals</td>
              <td align="right">
                Checked by: Sam Rivera
                <img class="footer-logo" src="assets/footer-logo-2.svg" alt="Eucalyptus sample footer logo">
              </td>
            </tr>
          </table>
        </td>
        <td></td>
      </tr>
    </table>
    <script>
      const goods = [
        "Linen throw", "Ceramic vase", "Cedar tray", "Woven basket",
        "Cotton cushion", "Oak serving board", "Wool runner", "Glass carafe",
        "Rattan storage box", "Cotton table runner", "Maple serving tray", "Wool blanket"
      ];
      const productIcons = [
        "canvas-tote", "stoneware-cup", "linen-pouch", "desk-journal",
        "steel-bottle", "wool-coaster", "glass-jar", "bamboo-pen",
        "cork-mat", "storage-tin", "cotton-towel", "desk-tray",
        "pencil-set", "tea-canister", "gift-box", "parcel-box"
      ];
      const target = document.getElementById("packing-items");
      let cartonCount = 0;
      let quantityTotal = 0;
      let netTotal = 0;
      let grossTotal = 0;
      let cbmTotal = 0;

      for (let index = 0; index < 64; index += 1) {
        const quantity = index % 5 + 2;
        const net = 4.2 + index % 7 * 0.6;
        const gross = net + 1.1;
        const cbm = 0.042 + index % 4 * 0.006;
        cartonCount += 1;
        quantityTotal += quantity;
        netTotal += net;
        grossTotal += gross;
        cbmTotal += cbm;
        const cells = [
          String(index + 1).padStart(2, "0"),
          goods[index % goods.length],
          quantity,
          net.toFixed(1),
          gross.toFixed(1),
          cbm.toFixed(3)
        ];
        const table = document.createElement("table");
        table.cellPadding = "0";
        table.cellSpacing = "0";
        table.border = "0";
        table.className = "paper_width section-table prowitem";
        table.innerHTML = `
          <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
          <tr>
            <td></td>
            <td>
              <table class="items-grid">
                <tr>
                  <td style="width:65px"></td><td style="width:inherit"></td><td style="width:54px"></td>
                  <td style="width:70px"></td><td style="width:75px"></td><td style="width:70px"></td>
                </tr>
                <tr>${cells.map((value, cell) => {
                  const icon = cell === 1
                    ? `<img src="assets/product-${productIcons[index % productIcons.length]}.svg" alt="${productIcons[index % productIcons.length]}">`
                    : "";
                  const productCell = cell === 1 ? " product-cell" : "";
                  const alignment = cell > 1 ? ' align="right"' : "";
                  return `
                    <td class="item-cell${index % 2 ? " alternate" : ""}${productCell}"${alignment}>
                      <div class="cell-content">${icon}${value}</div>
                    </td>`;
                }).join("")}</tr>
              </table>
            </td>
            <td></td>
          </tr>`;
        target.before(table);
      }
      target.remove();
      const summary = `Totals: ${cartonCount} cartons · ${quantityTotal} units · ${netTotal.toFixed(1)} kg net · ` +
        `${grossTotal.toFixed(1)} kg gross · ${cbmTotal.toFixed(3)} CBM`;
      document.getElementById("packing-totals").textContent = summary;
      document.getElementById("packing-shipment-details").textContent =
        `Cartons: ${cartonCount} · Gross weight: ${grossTotal.toFixed(1)} kg`;
    </script>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter_pagenum">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr>
        <td></td>
        <td><div class="page-number" data-page-number-container>Page <span data-page-number></span> of <span data-page-total></span></div></td>
        <td></td>
      </tr>
    </table>
  </div>
  <script src="../../dist/printform.js"></script>
</body>
</html>
