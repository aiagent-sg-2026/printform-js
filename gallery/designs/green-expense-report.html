<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Green Expense Report</title>
  <link rel="stylesheet" href="shared/page.css">
  <style>
    body { color: #203528; font-family: Arial, "Helvetica Neue", sans-serif; }
    .paper_width { width: 750px; }
    .section-table { table-layout: fixed; }
    .section-table td { box-sizing: border-box; vertical-align: top; }
    .header-art { display: block; width: 100%; height: 92px; }
    .info-grid, .items-grid, .totals-grid { width: 100%; table-layout: fixed; }
    .info-grid td { width: 50%; padding: 0 7px; font-size: 13px; line-height: 18px; }
    .info-box { min-height: 58px; padding: 7px; border: 1px solid #c9dfce; }
    .info-label { color: #15803d; font-weight: 700; }
    .items-grid td { font-size: 13px; line-height: 18px; }
    .head-cell { background: #15803d; color: white; font-weight: 700; }
    .items-grid .head-cell .cell-content { padding: 3px 5px; }
    .footer-logo { display: inline-block; vertical-align: middle; width: 90px; height: 24px; margin-left: 8px; color: #15803d; }
    .item-cell { border-bottom: 1px solid #dce9df; }
    .alternate { background: #f1f7f2; }
    .cell-content { padding: 3px 5px; }
    .totals-grid td { padding: 5px 8px; font-size: 13px; }
    .grand-total td { border-top: 2px solid #15803d; color: #166534; font-size: 16px; font-weight: 700; }
    .approval { display: table; width: 100%; margin-top: 9px; font-size: 13px; }
    .approval span { display: table-cell; width: 50%; padding: 9px 6px; border-top: 1px solid #718477; }
    .page-number { padding: 6px; font-size: 13px; text-align: center; }
  </style>
</head>
<body data-pf-label="PF-008 · Field Notes Expense Report · Green">
  <div class="paper_width printform" data-papersize-width="750" data-papersize-height="971"
    data-repeat-header="y" data-repeat-rowheader="y" data-repeat-footer-pagenum="y">
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pheader">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr><td></td><td><svg class="header-art" viewBox="0 0 720 92" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Field Notes">
        <rect width="720" height="92" fill="#15803d"/>
        <circle cx="44" cy="46" r="23" fill="white"/>
        <path d="M33 48l8 8 16-20" fill="none" stroke="#15803d" stroke-width="5"/>
        <text x="82" y="42" fill="white" font-family="Arial,sans-serif" font-size="22" font-weight="700">FIELD NOTES CO-OP</text>
        <text x="82" y="67" fill="#dcfce7" font-family="Arial,sans-serif" font-size="13">STAFF REIMBURSEMENT</text>
        <text x="690" y="57" fill="white" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="end">EXPENSE REPORT</text>
      </svg></td><td></td></tr>
    </table>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pdocinfo">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr><td></td><td><table class="info-grid">
        <tr><td style="width:50%"></td><td style="width:50%"></td></tr>
        <tr>
          <td><div class="info-box"><div class="info-label">EMPLOYEE</div>Jamie Example · Field coordinator<br>Employee ID: FN-014</div></td>
          <td><div class="info-box"><div class="info-label">REPORT PERIOD</div>October 1–31, 2026<br>Submitted: November 2, 2026</div></td>
        </tr>
      </table></td><td></td></tr>
    </table>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table prowheader">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr><td></td><td><table class="items-grid">
        <tr><td style="width:95px"></td><td style="width:125px"></td><td style="width:inherit"></td><td style="width:110px"></td></tr>
        <tr>
          <td class="head-cell"><div class="cell-content">Date</div></td>
          <td class="head-cell"><div class="cell-content">Category</div></td>
          <td class="head-cell"><div class="cell-content">Description</div></td>
          <td class="head-cell" align="right"><div class="cell-content">Amount</div></td>
        </tr>
      </table></td><td></td></tr>
    </table>
    <div id="expense-items"></div>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr><td></td><td><table class="totals-grid">
        <tr class="grand-total"><td></td><td>Total reimbursable</td><td id="expense-total" align="right">$0.00</td></tr>
      </table>
      <div class="approval">
        <span>Employee: ____________________</span>
        <span>Approved by: ____________________
          <img class="footer-logo" src="assets/footer-logo-2.svg" alt="Eucalyptus sample footer logo">
        </span>
      </div></td><td></td></tr>
    </table>
    <script>
      const categories = [
        "Travel", "Meals", "Supplies", "Parking", "Lodging", "Transit",
        "Postage", "Fuel", "Equipment", "Printing", "Materials", "Tolls"
      ];
      const notes = [
        "Client site visit", "Project materials", "Field meeting", "Local travel",
        "Supply pickup", "Regional workshop", "Courier shipment", "Team lunch",
        "Equipment rental", "Parking receipt", "Transit fare", "Print sample"
      ];
      const target = document.getElementById("expense-items");
      let totalCents = 0;
      for (let index = 0; index < 71; index += 1) {
        const amountCents = 1850 + (index % 6) * 725;
        totalCents += amountCents;
        const date = `Oct ${String(index % 28 + 1).padStart(2, "0")}, 2026`;
        const money = (cents) =>
          `$${(cents / 100).toLocaleString("en-US", { minimumFractionDigits: 2 })}`;
        const cells = [date, categories[index % categories.length], notes[index % notes.length], money(amountCents)];
        const table = document.createElement("table");
        table.cellPadding = "0";
        table.cellSpacing = "0";
        table.border = "0";
        table.className = "paper_width section-table prowitem";
        table.innerHTML = `
          <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
          <tr>
            <td></td>
            <td>
              <table class="items-grid">
                <tr><td style="width:95px"></td><td style="width:125px"></td><td style="width:inherit"></td><td style="width:110px"></td></tr>
                <tr>${cells.map((value, cell) => `
                  <td class="item-cell${index % 2 ? " alternate" : ""}"${cell === 3 ? ' align="right"' : ""}>
                    <div class="cell-content">${value}</div>
                  </td>`).join("")}
                </tr>
              </table>
            </td>
            <td></td>
          </tr>`;
        target.before(table);
      }
      target.remove();
      document.getElementById("expense-total").textContent = `$${(totalCents / 100).toLocaleString("en-US", { minimumFractionDigits: 2 })}`;
    </script>
    <table cellpadding="0" cellspacing="0" border="0" class="paper_width section-table pfooter_pagenum">
      <tr><td style="width:15px"></td><td style="width:inherit"></td><td style="width:15px"></td></tr>
      <tr><td></td><td><div class="page-number" data-page-number-container>Page <span data-page-number></span> of <span data-page-total></span></div></td><td></td></tr>
    </table>
  </div>
  <script src="../../dist/printform.js"></script>
</body>
</html>
